name: Build and QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Build
        run: gftools builder sources/config.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: hoysala-fonts
          path: fonts/**/*.ttf

  qa:
    needs: build
    runs-on: ubuntu-latest
    # Informational for now: the design work is unfinished and the derivative
    # inherits the parent's issues. Tighten to a hard gate before release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 3.11, not 3.12: fontbakery's googlefonts extra pins protobuf<4, which
      # has no wheel beyond 3.11. This job is also kept separate from the build
      # because that same pin conflicts with gftools.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: hoysala-fonts
          path: fonts

      - name: Install Fontbakery
        run: pip install -r requirements-qa.txt

      - name: Fontbakery
        run: |
          fontbakery check-googlefonts \
            --html fontbakery-report.html \
            --succinct \
            fonts/variable/*.ttf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontbakery-report
          path: fontbakery-report.html
